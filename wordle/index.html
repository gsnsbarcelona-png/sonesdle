<body>

<main class="page">

      <div class="header-line"></div>

    <p class="header-sub" data-i18n="headerSub">Adivina el nombre del pro player · 6 intentos</p>

  <div class="modes">

  <div class="leagues hidden" id="lengths"></div>

      <p class="end-title" id="endTitle"></p>
      <p class="end-word" id="endWord"></p>

        <button class="btn btn-confirm" id="btnAgain"  data-i18n="again">Otra palabra</button>
