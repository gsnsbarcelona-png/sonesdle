<!-- Favicon (raíz global) -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link rel="stylesheet" href="../shared/fonts/fonts.css">

<link rel="stylesheet" href="../shared/css/a11y.css">

<body>

<main class="page">
  <header class="header">
    <div class="header-title-row">
      <div class="header-line"></div>
      <h1>Family Grid</h1>
      <div class="header-line"></div>
    </div>
    <p class="header-sub" data-i18n="headerSub">Agrupa los 16 jugadores en 4 familias</p>
  </header>

  <div class="modes">
    <button class="mode-btn" data-mode="daily" data-i18n="daily">Reto diario</button>
    <button class="mode-btn" data-mode="free"  data-i18n="free">Modo libre</button>
  </div>
  <p class="day-info" id="dayInfo"></p>

  <div class="solved" id="solved"></div>
  <div class="board" id="board" role="group" aria-label="Jugadores / Players"></div>
  <div class="toast" id="toast" role="status"></div>

  <div class="lives" id="lives" role="img"></div>
  <div class="actions">
    <button class="btn btn-cancel" id="btnShuffle" data-i18n="shuffle">Mezclar</button>
    <button class="btn btn-cancel" id="btnClear"   data-i18n="clear">Borrar</button>
    <button class="btn btn-confirm" id="btnSubmit" data-i18n="submit">Validar</button>
  </div>
</main>

<!-- Resultado -->
<div class="overlay hidden" id="endOverlay">
  <div class="modal-card">
    <div class="modal-body end-body">
      <p class="end-title" id="endTitle"></p>
      <div class="end-groups" id="endGroups"></div>
      <div class="end-actions">
        <button class="btn btn-confirm" id="btnShare" data-i18n="share">Compartir</button>
        <button class="btn btn-confirm" id="btnAgain" data-i18n="again">Otro puzle</button>
        <button class="btn btn-cancel"  id="btnClose" data-i18n="close">Cerrar</button>
      </div>
      <p class="end-next" id="endNext"></p>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
<script type="module" src="../shared/js/pwa.js"></script>
<script type="module" src="../shared/js/analytics.js"></script>
<script type="module" src="../shared/js/notice.js"></script>
</body>
</html>
