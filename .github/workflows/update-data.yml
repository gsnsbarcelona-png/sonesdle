# Regenera los datos de los juegos desde Leaguepedia cada día y hace commit
# si algo ha cambiado (fichajes, retiradas, títulos...).
name: Actualizar datos

on:
  schedule:
    # Justo después de medianoche UTC: el reto diario del dle depende de los
    # datos, así que conviene que cambien al empezar el día y no a mitad.
    - cron: "10 0 * * *"
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      full:
        description: "Descargarlo todo de nuevo (si no, solo lo que ha cambiado)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # una descarga completa tarda bastante más que la diaria
    permissions:
      contents: write        # sube la rama de datos
      pull-requests: write   # abre y fusiona el PR de datos
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: league_players scrapper/league_players scrapper/requirements-build.txt

      - name: Instalar dependencias
        run: pip install -r "league_players scrapper/league_players scrapper/requirements-build.txt"

      # Caché de Leaguepedia entre ejecuciones: así cada día solo se descarga lo que
      # ha cambiado. Si se pierde (GitHub la borra tras 7 días sin usarse), build.py
      # lo descarga todo de nuevo. Se guarda también si build.py falla, para no
      # repetir una descarga larga ya hecha a medias.
      - name: Recuperar caché de Leaguepedia
        uses: actions/cache/restore@v6
        with:
          path: league_players scrapper/league_players scrapper/cache
          key: leaguepedia-${{ github.run_id }}
          restore-keys: leaguepedia-

      - name: Generar datos
        working-directory: league_players scrapper/league_players scrapper
        run: python build.py ${{ inputs.full && '--refresh' || '' }}

      - name: Guardar caché de Leaguepedia
        if: always()
        uses: actions/cache/save@v6
        with:
          path: league_players scrapper/league_players scrapper/cache
          key: leaguepedia-${{ github.run_id }}

      # Los datos vienen de una wiki que puede editar cualquiera, así que no se publican a ciegas:
      # tools/data_guard.py compara el resultado con lo publicado. Un día normal (unos pocos
      # jugadores, un día más de calendario) se fusiona solo; un cambio raro queda en un PR
      # abierto para que lo mire una persona.
      - name: Revisar los cambios
        id: guard
        run: python3 tools/data_guard.py --markdown "$RUNNER_TEMP/guard.md" --github-output "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar en un PR
        if: steps.guard.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SAFE: ${{ steps.guard.outputs.safe }}
        run: |
          BRANCH=datos/automatico   # rama del bot: se rehace en cada ejecución
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add dle/data/players.json rostergues/js/data/rosters.js \
                  carrera/js/data/players.js grid/data/players.json grid/data/schedule.json \
                  wordle/data/words.json wordle/data/schedule.json \
                  familias/data/players.json familias/data/schedule.json familias/data/bank.json
          git commit -m "datos: actualización diaria desde Leaguepedia"
          git push --force origin "$BRANCH"

          TITLE="datos: actualización diaria $(date -u +%F)"
          [ "$SAFE" = "true" ] || TITLE="$TITLE (revisar)"
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/guard.md"
          elif ! gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/guard.md"; then
            echo "::error::No se pudo crear el PR. Activa Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi

          if [ "$SAFE" = "true" ]; then
            gh pr merge "$BRANCH" --merge --delete-branch
          else
            echo "::warning::Los datos cambian más de lo normal: el PR queda abierto para revisarlo."
          fi
