# Regenera los datos de los juegos desde Leaguepedia cada día y hace commit
# si algo ha cambiado (fichajes, retiradas, títulos...).
name: Actualizar datos

on:
  schedule:
    # Justo después de medianoche UTC: el reto diario del dle depende de los
    # datos, así que conviene que cambien al empezar el día y no a mitad.
    - cron: "10 0 * * *"
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      full:
        description: "Descargarlo todo de nuevo (si no, solo lo que ha cambiado)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # una descarga completa tarda bastante más que la diaria
    permissions:
      contents: write      # solo este job necesita hacer push
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: league_players scrapper/league_players scrapper/requirements-build.txt

      - name: Instalar dependencias
        run: pip install -r "league_players scrapper/league_players scrapper/requirements-build.txt"

      # Caché de Leaguepedia entre ejecuciones: así cada día solo se descarga lo que
      # ha cambiado. Si se pierde (GitHub la borra tras 7 días sin usarse), build.py
      # lo descarga todo de nuevo. Se guarda también si build.py falla, para no
      # repetir una descarga larga ya hecha a medias.
      - name: Recuperar caché de Leaguepedia
        uses: actions/cache/restore@v6
        with:
          path: league_players scrapper/league_players scrapper/cache
          key: leaguepedia-${{ github.run_id }}
          restore-keys: leaguepedia-

      - name: Generar datos
        working-directory: league_players scrapper/league_players scrapper
        run: python build.py ${{ inputs.full && '--refresh' || '' }}

      - name: Guardar caché de Leaguepedia
        if: always()
        uses: actions/cache/save@v6
        with:
          path: league_players scrapper/league_players scrapper/cache
          key: leaguepedia-${{ github.run_id }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dle/data/players.json rostergues/js/data/rosters.js \
                  carrera/js/data/players.js grid/data/players.json grid/data/schedule.json \
                  wordle/data/words.json wordle/data/schedule.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            exit 0
          fi
          git commit -m "datos: actualización diaria desde Leaguepedia"
          # Si alguien ha hecho push mientras tanto, se integra antes de subir
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
