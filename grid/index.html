<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL Pro Grid · LOL Pro Games</title>

<!-- SEO -->
<meta name="description" content="Rellena la cuadrícula 3×3 con pro players de LoL. Encuentra el jugador que cumple dos criterios a la vez. Vidas limitadas.">
<meta name="keywords" content="lol, league of legends, pro player, grid, esports, adivina, lolprogames">
<meta name="author" content="LOL Pro Games">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.lolprogames.com/grid/">

<!-- Open Graph -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://www.lolprogames.com/grid/">
<meta property="og:title"       content="LoL Pro Grid · LOL Pro Games">
<meta property="og:description" content="Cuadrícula 3×3 con pro players de LoL. Combina equipo, posición, liga y más.">
<meta property="og:image"       content="https://www.lolprogames.com/og-image.jpg">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"    content="LoL Pro Grid · LOL Pro Games">
  <meta property="og:site_name"      content="LOL Pro Games">
  <meta property="og:locale"         content="es_ES">
  <meta property="og:locale:alternate" content="en_GB">

<!-- Twitter Card -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="LoL Pro Grid · LOL Pro Games">
<meta name="twitter:description" content="Cuadrícula 3×3 con pro players de LoL.">
<meta name="twitter:image"       content="https://www.lolprogames.com/og-image.jpg">
  <meta name="twitter:image:alt"   content="LoL Pro Grid · LOL Pro Games">

<!-- PWA / App -->
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOL Pro Games">
<link rel="manifest" href="../manifest.json">

<!-- Favicon (raíz global) -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png"     href="../favicon.png" sizes="32x32">
<link rel="apple-touch-icon"          href="../apple-touch-icon.png">

<!-- Preconnect -->

<!-- Preload fondo -->

<!-- Shared CSS variables (LOLPROGAMES global) -->
<link rel="stylesheet" href="../shared/css/variables.css">

<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="../shared/css/a11y.css">
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<main class="page">
  <header class="header">
    <div class="header-title-row">
      <div class="header-line"></div>
      <h1>LoL Pro Grid</h1>
      <div class="header-line"></div>
    </div>
    <p class="header-sub" data-i18n="headerSub">Completa las 9 casillas · Pro Players</p>
  </header>

  <div class="modes" id="modes">
    <button class="mode-btn" data-mode="daily" data-i18n="daily">Reto diario</button>
    <button class="mode-btn" data-mode="free"  data-i18n="free">Modo libre</button>
  </div>

  <div class="lives-row" id="livesRow">
    <span class="lives-label">Vidas</span>
  </div>

  <div class="grid-outer">
    <div class="grid-wrap" id="grid"></div>
  </div>

  <div class="progress-row" id="progressRow">
    <span class="progress-label">Celdas</span>
  </div>

  <!-- Tras "Ver soluciones": volver a jugar desde el tablero -->
  <button class="btn-replay hidden" id="btnBoardReplay" data-i18n="tryAgain">Intentar de nuevo</button>
</main>

<!-- Modal -->
<div class="overlay" id="modalOverlay" style="display:none">
  <div class="modal-card">
    <div class="modal-body">
      <div class="cell-context">
        <span class="cell-context-icons" id="modalIcons"></span>
        <span class="cell-context-text" id="modalDesc"></span>
      </div>
      <p class="error-msg" id="errorMsg" role="alert"></p>
      <div class="input-wrap">
        <input class="modal-input" id="playerInput" data-aria="player" type="text"
               data-i18n-ph="placeholder" placeholder="Nombre del pro player…" autocomplete="off" spellcheck="false">
        <div class="ac-list" id="acList"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-confirm" id="btnConfirm" data-i18n="confirm">Confirmar</button>
        <button class="btn btn-cancel"  id="btnCancel"  data-i18n="cancel">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- Victory -->
<div class="end-overlay" id="victoryOverlay" style="display:none">
  <div class="end-card">
    <div class="end-body">
      <svg class="end-icon victory-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>
      <p class="end-title"   data-i18n="victory">¡Victoria!</p>
      <p class="end-sub teal" data-i18n="victorySub">Todas las casillas completadas</p>
      <p class="end-streak hidden"></p>
      <button class="btn-replay btn-share hidden" data-i18n="share">Compartir</button>
      <button class="btn-replay" id="btnVictoryReplay"  data-i18n="playAgain">Jugar de nuevo</button>
      <button class="btn-link" id="btnVictoryView" data-i18n="seeBoard">Ver tablero</button>
    </div>
  </div>
</div>

<!-- Game Over -->
<div class="end-overlay" id="gameoverOverlay" style="display:none">
  <div class="end-card">
    <div class="end-body">
      <svg class="end-icon gameover-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      <p class="end-title"  data-i18n="gameOver">Game Over</p>
      <p class="end-sub red" data-i18n="gameOverSub">Se acabaron las vidas</p>
      <p class="end-streak hidden"></p>
      <button class="btn-replay btn-share hidden" data-i18n="share">Compartir</button>
      <button class="btn-replay" id="btnGameoverReplay" data-i18n="tryAgain">Intentar de nuevo</button>
      <button class="btn-link" id="btnGameoverView" data-i18n="seeSolutions">Ver soluciones</button>
    </div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
<script type="module" src="../shared/js/pwa.js"></script>
<script type="module" src="../shared/js/notice.js"></script>
</body>
</html>
